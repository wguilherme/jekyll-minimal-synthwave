title: minimal synthwave # name of the site
author: Withney Guilherme # name of site's author
email: wguilherme.dev@gmail.com # email of site's author
url: https://github.com/wguilherme/jekyll-minimal-synthwave # root address of the site
baseurl: "/jekyll-minimal-synthwave" # subpath of the site, e.g. "/blog" (leave it blank "" if you're site shouldn't use a subpath)
description: > # description of the site (multiple lines allowed)
  A (nearly) no-CSS, fast, minimalist Jekyll theme with synthwave aesthetics.

permalink: /:slug.html

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

remote_theme: wguilherme/jekyll-minimal-synthwave # for GitHub Pages deployment

theme_config:
  style: synthwave # 'hacker' or 'synthwave'
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  show_archive_button: false # show interactive archive button on home page (deprecated, use nav_buttons instead)
  archive_button_text: "📚 Browse Archive" # text for archive button
  archive_button_url: "archive-interactive.html" # URL for archive button
  enable_code_highlighting: true # enable Prism.js syntax highlighting
  code_theme: "prism-synthwave84" # prism theme: prism-synthwave84, prism-one-dark, prism-night-owl, prism-dracula

# Navigation buttons (minimalist style buttons at the top)
nav_buttons:
  - text: "📚 Browse Archive"
    url: "archive-interactive.html"
  - text: "about"
    url: "about.html"
  - text: "github"
    url: "https://github.com/wguilherme/jekyll-minimal-synthwave"
  - text: "contact"
    url: "mailto:wguilherme.dev@gmail.com"

sass:
  style: :compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
